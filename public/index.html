<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>JapanChecker</title>
<style>
  body { font-family: sans-serif; max-width: 920px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  button { padding: 10px 18px; font-size: 14px; cursor: pointer; margin-right: 8px; margin-bottom: 8px; }
  #status { margin-top: 20px; padding: 12px; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
  .tabs { margin-top: 24px; border-bottom: 2px solid #ddd; }
  .tab-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: none; background: none; border-bottom: 3px solid transparent; margin-right: 4px; }
  .tab-btn.active { border-bottom: 3px solid #2563eb; font-weight: bold; color: #2563eb; }
  .tab-panel { display: none; padding-top: 16px; }
  .tab-panel.active { display: block; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; flex-wrap: wrap; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; white-space: nowrap; }
  th { background: #f4f4f4; position: sticky; top: 0; }
  .table-wrap { max-height: 460px; overflow: auto; border: 1px solid #ddd; }
  .badge { display: inline-block; background: #dc2626; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }
  .empty { color: #888; font-size: 13px; padding: 12px; }
  .note { color: #888; font-size: 12px; padding: 6px 4px; }
  tr.called { background: #f0fdf4; color: #888; }
  tr.called td { text-decoration: line-through; }
  .call-cell { text-align: center; white-space: nowrap; }
  textarea { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 13px; padding: 8px; }
  .domain-box { background: #f9fafb; border: 1px solid #ddd; border-radius: 6px; padding: 14px; margin-bottom: 20px; }
  .save-msg { font-size: 13px; margin-left: 8px; color: #0a7d28; }
</style>
</head>
<body>
  <h1>JapanChecker</h1>
  <p>ドメイン一覧を入力して解析し、result.csv に営業リストを出力します。架電したら「架電」列にチェックを入れると記録されます。</p>

  <div class="domain-box">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
      <strong>解析したいドメイン一覧(1行に1ドメイン)</strong>
      <span class="note" id="domainCount" style="padding:0;">未読み込み</span>
    </div>
    <textarea id="domainsArea" rows="10" placeholder="example.com&#10;example.jp&#10;sample.net"></textarea>
    <div class="toolbar" style="margin-top:8px;">
      <button id="saveDomainsBtn">この内容を保存する</button>
      <button id="loadDomainsBtn">サーバー上の内容を読み込み直す</button>
      <label style="cursor:pointer;">
        <input type="file" id="domainsFileInput" accept=".txt,.csv" style="display:none;" />
        <span id="domainsFileLabel" style="text-decoration:underline;">…またはテキストファイルを選んで読み込む</span>
      </label>
      <span id="saveMsg" class="save-msg" style="display:none;">保存しました</span>
    </div>
    <p class="note" style="padding:0; margin-top:6px;">
      「https://」や「www.」が付いたままでも自動的に取り除かれます。保存すると、サーバー上の domains.txt が上書きされます。
    </p>
  </div>

  <label style="display:block; margin-bottom:10px; font-size:13px;">
    <input type="checkbox" id="resumeCheck" />
    続きから再開する(前回のresult.csvに残っている分はスキップして続きだけ処理)
  </label>

  <button id="startBtn">解析を開始</button>
  <button id="stopBtn">停止</button>
  <button id="notifyBtn">ブラウザ通知を許可する</button>
  <div id="status">待機中です。</div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="all">全結果</button>
    <button class="tab-btn" data-tab="new">未架電リスト<span id="newBadge" class="badge" style="display:none;">0</span></button>
  </div>

  <div id="tab-all" class="tab-panel active">
    <div class="toolbar">
      <button id="downloadBtn">result.csv をダウンロード</button>
      <button id="refreshAllBtn">一覧を更新</button>
      <label><input type="checkbox" id="allFilterCheck" /> 未架電のみ表示</label>
    </div>
    <div id="allTableWrap" class="table-wrap"><div class="empty">「一覧を更新」を押すと表示されます。</div></div>
  </div>

  <div id="tab-new" class="tab-panel">
    <p class="note" style="margin:0 0 8px;">見つかった時期に関わらず、まだ架電していない事業者はすべてここに表示されます(架電すると自動的にこの一覧から消えます)。</p>
    <div class="toolbar">
      <button id="downloadNewBtn">未架電リストをダウンロード</button>
      <button id="refreshNewBtn">一覧を更新</button>
      <label><input type="checkbox" id="newFilterCheck" checked /> 架電済みをその場で非表示にする</label>
    </div>
    <div id="newTableWrap" class="table-wrap"><div class="empty">まだ対象がありません。</div></div>
  </div>

<script>
const statusEl = document.getElementById('status');
const domainsArea = document.getElementById('domainsArea');
const domainCount = document.getElementById('domainCount');
const saveDomainsBtn = document.getElementById('saveDomainsBtn');
const loadDomainsBtn = document.getElementById('loadDomainsBtn');
const domainsFileInput = document.getElementById('domainsFileInput');
const saveMsg = document.getElementById('saveMsg');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const notifyBtn = document.getElementById('notifyBtn');
const downloadBtn = document.getElementById('downloadBtn');
const downloadNewBtn = document.getElementById('downloadNewBtn');
const refreshAllBtn = document.getElementById('refreshAllBtn');
const refreshNewBtn = document.getElementById('refreshNewBtn');
const resumeCheck = document.getElementById('resumeCheck');
const newBadge = document.getElementById('newBadge');
const allTableWrap = document.getElementById('allTableWrap');
const newTableWrap = document.getElementById('newTableWrap');
const allFilterCheck = document.getElementById('allFilterCheck');
const newFilterCheck = document.getElementById('newFilterCheck');

let polling = null;
let wasRunning = false;
let notified = false;

function formatMs(ms) {
  if (ms === null || ms === undefined) return '---';
  const sec = Math.round(ms / 1000);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}分${s}秒`;
}

// タブ切り替え
document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// 架電チェックボックスの切り替え処理を共通化
async function onCallToggle(e) {
  const tr = e.target.closest('tr');
  const domain = tr.dataset.domain;
  tr.classList.toggle('called', e.target.checked);
  try {
    await fetch('/api/call-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ domain, called: e.target.checked }),
    });
  } catch (err) {
    alert('架電状況の保存に失敗しました');
  }
}

function applyFilter(wrap, hideCalled) {
  wrap.querySelectorAll('tbody tr').forEach((tr) => {
    const cb = tr.querySelector('.call-check');
    tr.style.display = hideCalled && cb && cb.checked ? 'none' : '';
  });
}

function renderTable(data, wrap, filterCheckbox) {
  if (!data.rows || data.rows.length === 0) {
    wrap.innerHTML = '<div class="empty">データがありません。</div>';
    return;
  }
  const domainKey = data.headers[0]; // 先頭列 = ドメイン

  let html = '';
  if (data.truncated) {
    html += `<div class="note">表示は先頭${data.rows.length}件までです(全${data.totalRows}件。全件はCSVでご確認ください)</div>`;
  }
  html += '<table><thead><tr><th>架電</th>';
  data.headers.forEach((h) => (html += `<th>${h}</th>`));
  html += '</tr></thead><tbody>';
  data.rows.forEach((row) => {
    const domain = row[domainKey] || '';
    const checked = row.__called ? 'checked' : '';
    html += `<tr data-domain="${domain}" class="${row.__called ? 'called' : ''}">`;
    html += `<td class="call-cell"><input type="checkbox" class="call-check" ${checked} /></td>`;
    data.headers.forEach((h) => (html += `<td>${row[h] ?? ''}</td>`));
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('.call-check').forEach((cb) => {
    cb.addEventListener('change', (e) => {
      onCallToggle(e);
      if (filterCheckbox && filterCheckbox.checked) applyFilter(wrap, true);
    });
  });

  if (filterCheckbox) applyFilter(wrap, filterCheckbox.checked);
}

async function loadAllList() {
  const res = await fetch('/api/result-list');
  const data = await res.json();
  renderTable(data, allTableWrap, allFilterCheck);
}

async function loadNewList() {
  const res = await fetch('/api/new-list');
  const data = await res.json();
  if (data.rows && data.rows.length > 0) {
    newBadge.style.display = 'inline-block';
    newBadge.textContent = data.totalRows;
  } else {
    newBadge.style.display = 'none';
  }
  renderTable(data, newTableWrap, newFilterCheck);
}

allFilterCheck.addEventListener('change', () => applyFilter(allTableWrap, allFilterCheck.checked));
newFilterCheck.addEventListener('change', () => applyFilter(newTableWrap, newFilterCheck.checked));

function notifyIfNeeded(s) {
  if (!s.running && wasRunning && !notified && s.newFound > 0) {
    notified = true;
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      new Notification('JapanChecker', {
        body: `新規の事業者を ${s.newFound} 件検出しました`,
      });
    }
    loadNewList();
    loadAllList();
  }
  wasRunning = s.running;
}

async function refreshStatus() {
  const res = await fetch('/api/status');
  const s = await res.json();
  const runningLabel = s.running ? '動作中' : '停止中';
  statusEl.textContent =
    `状態: ${runningLabel}${s.resumed ? '(再開モード)' : ''}\n` +
    `全体件数: ${s.total}件\n` +
    `前回までの処理済み: ${s.alreadyDone}件\n` +
    `今回処理した件数: ${s.processed}件\n` +
    `残り件数(目安): ${s.remaining}件\n` +
    `該当件数(スコア対象): ${s.matched}件\n` +
    `新規発見件数: ${s.newFound}件\n` +
    `経過時間: ${formatMs(s.elapsedMs)}\n` +
    `残り予測時間(目安): ${formatMs(s.etaMs)}\n` +
    (s.skipped ? `停止によりスキップ: ${s.skipped}件\n` : '') +
    (s.zeroScoreSkipped ? `スコア0件でCSV未出力: ${s.zeroScoreSkipped}件\n` : '') +
    (s.lastError ? `エラー: ${s.lastError}\n` : '');

  if (s.newFound > 0) {
    newBadge.style.display = 'inline-block';
    newBadge.textContent = s.newFound;
  }

  notifyIfNeeded(s);

  if (!s.running && polling) {
    clearInterval(polling);
    polling = null;
  }
}

notifyBtn.addEventListener('click', async () => {
  if (typeof Notification === 'undefined') {
    alert('このブラウザは通知に対応していません。');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    alert('通知を許可しました。新着が見つかったときにお知らせします。');
  }
});

startBtn.addEventListener('click', async () => {
  notified = false;
  const res = await fetch('/api/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ resume: resumeCheck.checked }),
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || '開始できませんでした');
    return;
  }
  polling = setInterval(refreshStatus, 1500);
  refreshStatus();
});

stopBtn.addEventListener('click', async () => {
  const res = await fetch('/api/stop', { method: 'POST' });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || '停止できませんでした');
  }
});

downloadBtn.addEventListener('click', () => {
  window.location.href = '/api/download';
});

downloadNewBtn.addEventListener('click', () => {
  window.location.href = '/api/download-new';
});

refreshAllBtn.addEventListener('click', loadAllList);
refreshNewBtn.addEventListener('click', loadNewList);

// ---- ドメイン一覧の読み込み・保存 ----

async function loadDomainsFromServer() {
  const res = await fetch('/api/domains');
  const data = await res.json();
  domainsArea.value = data.text;
  domainCount.textContent = `現在 ${data.count} 件`;
}

saveDomainsBtn.addEventListener('click', async () => {
  const res = await fetch('/api/domains', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: domainsArea.value }),
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || '保存できませんでした');
    return;
  }
  domainCount.textContent = `現在 ${data.count} 件`;
  saveMsg.style.display = 'inline';
  setTimeout(() => (saveMsg.style.display = 'none'), 2000);
});

loadDomainsBtn.addEventListener('click', loadDomainsFromServer);

domainsFileInput.addEventListener('change', () => {
  const file = domainsFileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    domainsArea.value = reader.result;
    domainCount.textContent = '(保存ボタンを押すまで未保存)';
  };
  reader.readAsText(file, 'utf-8');
});

loadDomainsFromServer();

refreshStatus();
loadNewList();
</script>
</body>
</html>
